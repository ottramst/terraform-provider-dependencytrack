name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Terraform Provider Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPENDENCYTRACK_ENDPOINT: http://localhost:8081
      DEPENDENCYTRACK_USERNAME: admin
      DEPENDENCYTRACK_PASSWORD: admin123
      # DT_VERSION selects the compose image tag; DEPENDENCYTRACK_SERVER_VERSION
      # lets the tests skip the /api/version probe.
      DT_VERSION: ${{ matrix.dtrack.version }}
      DEPENDENCYTRACK_SERVER_VERSION: ${{ matrix.dtrack.version }}
    strategy:
      fail-fast: false
      matrix:
        # Only non-EOL Dependency-Track releases are tested (latest patch of
        # each): v4 4.14.x until its December 2026 EOL, and the newest v5
        # minor. EOL versions get best-effort support only (see README).
        # Keep the defaults in docker-compose*.yml in sync with these entries.
        dtrack:
          - { version: '4.14.6', compose: docker-compose.yml }
          - { version: '5.2.1', compose: docker-compose.v5.yml }
        terraform-version:
          - '1.9.*'
          - '1.12.*'
          - '1.15.*'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform-version }}
          terraform_wrapper: false
      - name: Start Dependency Track
        run: docker compose -f ${{ matrix.dtrack.compose }} up -d apiserver postgres
      - name: Init Dependency Track
        run: echo "DEPENDENCYTRACK_API_KEY=$(go run scripts/init_dtrack.go)" >> "$GITHUB_ENV"
      - run: go mod download
      - run: make testacc
