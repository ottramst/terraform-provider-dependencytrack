name: Feature request
description: Suggest a new resource, data source, attribute, or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like the provider to do, and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Proposed configuration
      description: Optional. How you would like to write it in Terraform.
      render: hcl
  - type: input
    id: dtrack-version
    attributes:
      label: Dependency-Track version
      description: The Dependency-Track version that provides the underlying feature, if known.
      placeholder: "5.2.1"
  - type: textarea
    id: references
    attributes:
      label: References
      description: Optional. Links to Dependency-Track documentation, API endpoints, or related issues.
